<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Logistics Simulator 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { margin: 0; overflow: hidden; background: #0b0f19; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .ui-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI Superior -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none">
        <div class="ui-panel px-4 py-2 rounded-xl text-white shadow-lg pointer-events-auto">
            <h1 class="font-bold text-xs tracking-wider text-amber-400">LOGISTICS SIMULATOR</h1>
            <p id="mode-status" class="text-xs text-slate-300">Modo: A Pé (Trabalhador)</p>
        </div>
        <div class="ui-panel px-4 py-2 rounded-xl text-white shadow-lg text-right pointer-events-auto">
            <span class="text-xs text-amber-400 font-semibold">ESTATUTO</span>
            <p id="mission-text" class="text-xs text-slate-200">Aproxime-se do empilhador ou palete</p>
        </div>
    </div>

    <!-- Controlo Táctil / Joystick -->
    <div class="absolute bottom-6 left-6 flex items-center gap-4 pointer-events-auto">
        <div id="joystick-base" class="w-32 h-32 rounded-full bg-slate-900/60 border-2 border-slate-700 relative flex items-center justify-center shadow-inner">
            <div id="joystick-knob" class="w-12 h-12 rounded-full bg-amber-500 shadow-md absolute cursor-pointer transition-transform duration-75"></div>
        </div>
    </div>

    <!-- Botões de Ação Dinâmicos -->
    <div class="absolute bottom-6 right-6 flex flex-col gap-3 pointer-events-auto">
        <button id="toggle-mode-btn" class="ui-panel px-5 py-3 rounded-xl text-amber-400 font-bold shadow-lg border border-amber-500/30 flex items-center justify-center gap-2 active:scale-95 transition text-sm">
            <i class="fa-solid fa-person"></i> ENTRAR NO EMPILHADOR
        </button>
        <div id="forklift-controls" class="hidden flex flex-col gap-2">
            <button id="action-pallet-btn" class="ui-panel px-5 py-3 rounded-xl text-emerald-400 font-bold shadow-lg border border-emerald-500/30 flex items-center justify-center gap-2 active:scale-95 transition text-sm">
                <i class="fa-solid fa-box"></i> AGARRAR PALETE
            </button>
            <div class="flex gap-2">
                <button id="lift-up" class="ui-panel px-4 py-2.5 rounded-xl text-white font-bold flex-1 flex items-center justify-center gap-1 active:scale-95 transition text-xs">
                    <i class="fa-solid fa-arrow-up"></i> SUBIR
                </button>
                <button id="lift-down" class="ui-panel px-4 py-2.5 rounded-xl text-white font-bold flex-1 flex items-center justify-center gap-1 active:scale-95 transition text-xs">
                    <i class="fa-solid fa-arrow-down"></i> DESCER
                </button>
            </div>
        </div>
    </div>

    <!-- Dependências Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const baseUrl = 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/';

        let scene, camera, renderer, controls, clock;
        let warehouse, worker, forklift;
        let workerMixer, workerActions = {}, activeWorkerAction;
        let pallets = [], racks = [];
        let attachedPallet = null;
        let forksGroup, forksHeight = 0;

        let currentMode = 'worker'; // 'worker' or 'forklift'
        let moveForward = 0, moveTurn = 0;
        let speed = 0, maxSpeedWorker = 0.04, maxSpeedForklift = 0.08, turnSpeed = 0.04;

        init();
        animate();

        function init() {
            const container = id => document.getElementById(id);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.012);

            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, -6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            container('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Evitar entrar debaixo do chão

            // Iluminação profissional sem shadow acne
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
            dirLight.position.set(15, 25, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            const loader = new THREE.GLTFLoader();

            // 1. Armazém Principal (Sem sobreposições)
            loader.load(baseUrl + 'warehouse.glb', (gltf) => {
                warehouse = gltf.scene;
                warehouse.traverse(node => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                scene.add(warehouse);
            }, undefined, err => console.error('Erro warehouse:', err));

            // 2. Empilhador
            loader.load(baseUrl + 'forklift.glb', (gltf) => {
                forklift = gltf.scene;
                forklift.position.set(3, 0, 0);
                forklift.traverse(node => { if (node.isMesh) node.castShadow = true; });

                forksGroup = new THREE.Group();
                forksGroup.position.set(0, 0, 0);
                forklift.add(forksGroup);

                scene.add(forklift);
            }, undefined, err => console.error('Erro forklift:', err));

            // 3. Trabalhador com Animações Articuladas (AnimationMixer)
            loader.load(baseUrl + 'worker.glb', (gltf) => {
                worker = gltf.scene;
                worker.position.set(0, 0, -2);
                worker.scale.set(1, 1, 1);
                worker.traverse(node => { if (node.isMesh) node.castShadow = true; });
                scene.add(worker);

                if (gltf.animations && gltf.animations.length > 0) {
                    workerMixer = new THREE.AnimationMixer(worker);
                    gltf.animations.forEach((clip) => {
                        workerActions[clip.name.toLowerCase()] = workerMixer.clipAction(clip);
                    });
                    // Fallback para primeira animação ou caminhar
                    const defaultAction = workerActions['walk'] || workerActions['caminhar'] || workerActions[Object.keys(workerActions)[0]];
                    if (defaultAction) {
                        activeWorkerAction = defaultAction;
                        activeWorkerAction.play();
                        activeWorkerAction.paused = true; // Só reproduz ao mover
                    }
                }
            }, undefined, err => console.error('Erro worker:', err));

            loader.load(baseUrl + 'palleteuro.glb', (gltfPallet) => {
                loader.load(baseUrl + 'box.glb', (gltfBox) => {
                    loader.load(baseUrl + 'plasticdrum.glb', (gltfDrum) => {
                        loader.load(baseUrl + 'rackpallet.glb', (gltfRack) => {
                            
                            // Adicionar Estantes de Armazém
                            const rackPositions = [{x: -6, z: 5}, {x: 6, z: 5}, {x: -6, z: 12}, {x: 6, z: 12}];
                            rackPositions.forEach(pos => {
                                const rack = gltfRack.scene.clone();
                                rack.position.set(pos.x, 0, pos.z);
                                rack.traverse(n => { if(n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
                                scene.add(rack);
                                racks.push(rack);
                            });

                            // Criar Paletes Carregadas com Caixas e Bidões
                            const palletSpots = [{x: -2, z: 6}, {x: 2, z: 10}, {x: 0, z: 14}];
                            palletSpots.forEach(pos => {
                                const pallet = gltfPallet.scene.clone();
                                pallet.position.set(pos.x, 0, pos.z);
                                pallet.traverse(n => { if(n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });

                                // Pilha de Caixas
                                const box1 = gltfBox.scene.clone();
                                box1.position.set(-0.2, 0.15, -0.2);
                                box1.scale.set(0.7, 0.7, 0.7);
                                pallet.add(box1);

                                const box2 = gltfBox.scene.clone();
                                box2.position.set(0.2, 0.15, 0.2);
                                box2.scale.set(0.7, 0.7, 0.7);
                                pallet.add(box2);

                                const boxTop = gltfBox.scene.clone();
                                boxTop.position.set(0, 0.5, 0);
                                boxTop.scale.set(0.6, 0.6, 0.6);
                                pallet.add(boxTop);

                                // Bidão de Plástico ao lado na palete
                                const drum = gltfDrum.scene.clone();
                                drum.position.set(0, 0.15, -0.5);
                                drum.scale.set(0.85, 0.85, 0.85);
                                pallet.add(drum);

                                scene.add(pallet);
                                pallets.push(pallet);
                            });
                        });
                    });
                });
            });

            setupTouchJoystick();
            setupInteractions();
            window.addEventListener('resize', onWindowResize);
        }

        function setupTouchJoystick() {
            const base = document.getElementById('joystick-base');
            const knob = document.getElementById('joystick-knob');
            let active = false;
            let rect = base.getBoundingClientRect();
            let maxRadius = 40;

            function handleStart(e) {
                active = true;
                rect = base.getBoundingClientRect();
                handleMove(e);
            }

            function handleMove(e) {
                if (!active) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                let x = clientX - (rect.left + rect.width / 2);
                let y = clientY - (rect.top + rect.height / 2);

                const distance = Math.sqrt(x * x + y * y);
                if (distance > maxRadius) {
                    x *= maxRadius / distance;
                    y *= maxRadius / distance;
                }

                knob.style.transform = `translate(${x}px, ${y}px)`;
                moveTurn = -x / maxRadius;
                moveForward = -y / maxRadius;
            }

            function handleEnd() {
                active = false;
                knob.style.transform = `translate(0px, 0px)`;
                moveForward = 0;
                moveTurn = 0;
            }

            base.addEventListener('touchstart', handleStart);
            window.addEventListener('touchmove', handleMove);
            window.addEventListener('touchend', handleEnd);
            base.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
        }

        function setupInteractions() {
            const toggleBtn = document.getElementById('toggle-mode-btn');
            const forkliftUI = document.getElementById('forklift-controls');
            const actionBtn = document.getElementById('action-pallet-btn');
            const liftUpBtn = document.getElementById('lift-up');
            const liftDownBtn = document.getElementById('lift-down');

            toggleBtn.addEventListener('click', () => {
                if (!worker || !forklift) return;

                if (currentMode === 'worker') {
                    // Verificar proximidade ao empilhador
                    const dist = worker.position.distanceTo(forklift.position);
                    if (dist < 3.0) {
                        currentMode = 'forklift';
                        worker.visible = false;
                        document.getElementById('mode-status').innerText = "Modo: A Conduzir Empilhador";
                        toggleBtn.innerHTML = `<i class="fa-solid fa-person"></i> SAIR DO EMPILHADOR`;
                        forkliftUI.classList.remove('hidden');
                    } else {
                        document.getElementById('mission-text').innerText = "Aproxime-se mais do empilhador!";
                    }
                } else {
                    // Sair do empilhador
                    currentMode = 'worker';
                    worker.position.copy(forklift.position).add(new THREE.Vector3(1.5, 0, 0));
                    worker.visible = true;
                    document.getElementById('mode-status').innerText = "Modo: A Pé (Trabalhador)";
                    toggleBtn.innerHTML = `<i class="fa-solid fa-person"></i> ENTRAR NO EMPILHADOR`;
                    forkliftUI.classList.add('hidden');
                }
            });

            // Controlo de altura dos garfos
            liftUpBtn.addEventListener('mousedown', () => { if (forksHeight < 1.2) forksHeight += 0.05; });
            liftDownBtn.addEventListener('mousedown', () => { if (forksHeight > 0) forksHeight -= 0.05; });

            // Agarrar / Largar Palete Carregada
            actionBtn.addEventListener('click', () => {
                if (!forklift) return;

                if (!attachedPallet) {
                    pallets.forEach(pallet => {
                        const dist = forklift.position.distanceTo(pallet.position);
                        if (dist < 2.8) {
                            attachedPallet = pallet;
                            scene.remove(pallet);
                            forklift.add(pallet);
                            pallet.position.set(0, forksHeight, 1.3);
                            pallet.rotation.set(0, 0, 0);
                            document.getElementById('mission-text').innerText = "Palete com carga acoplada!";
                            actionBtn.innerHTML = `<i class="fa-solid fa-box-open"></i> LARGAR PALETE`;
                            actionBtn.classList.replace('text-emerald-400', 'text-rose-400');
                            actionBtn.classList.replace('border-emerald-500/30', 'border-rose-500/30');
                        }
                    });
                } else {
                    forklift.remove(attachedPallet);
                    scene.add(attachedPallet);

                    const worldPos = new THREE.Vector3();
                    const worldQuat = new THREE.Quaternion();
                    attachedPallet.getWorldPosition(worldPos);
                    attachedPallet.getWorldQuaternion(worldQuat);

                    attachedPallet.position.copy(worldPos);
                    attachedPallet.quaternion.copy(worldQuat);

                    attachedPallet = null;
                    document.getElementById('mission-text').innerText = "Palete descarregada com sucesso!";
                    actionBtn.innerHTML = `<i class="fa-solid fa-box"></i> AGARRAR PALETE`;
                    actionBtn.classList.replace('text-rose-400', 'text-emerald-400');
                    actionBtn.classList.replace('border-rose-500/30', 'border-emerald-500/30');
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (currentMode === 'worker' && worker) {
                speed = moveForward * maxSpeedWorker;
                if (Math.abs(moveForward) > 0.05 || Math.abs(moveTurn) > 0.05) {
                    worker.rotation.y += moveTurn * turnSpeed;
                    worker.translateZ(speed);

                    if (activeWorkerAction) {
                        activeWorkerAction.paused = false;
                        activeWorkerAction.timeScale = speed * 25;
                    }
                } else {
                    if (activeWorkerAction) activeWorkerAction.paused = true;
                }

                if (workerMixer) workerMixer.update(delta);

                // Câmara a seguir o trabalhador
                const targetCamPos = new THREE.Vector3(0, 2.5, -4.5).applyMatrix4(worker.matrixWorld);
                camera.position.lerp(targetCamPos, 0.1);
                controls.target.lerp(worker.position, 0.1);

            } else if (currentMode === 'forklift' && forklift) {
                speed = moveForward * maxSpeedForklift;
                forklift.rotation.y += moveTurn * turnSpeed * (speed !== 0 ? 1 : 0);
                forklift.translateZ(speed);

                if (forksGroup) {
                    forksGroup.position.y = forksHeight;
                }

                // Câmara a seguir o empilhador
                const targetCamPos = new THREE.Vector3(0, 3.5, -6.5).applyMatrix4(forklift.matrixWorld);
                camera.position.lerp(targetCamPos, 0.1);
                controls.target.lerp(forklift.position, 0.1);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
