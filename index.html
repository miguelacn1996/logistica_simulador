<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Logistics Simulator 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { margin: 0; overflow: hidden; background: #0b0f19; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .ui-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- UI Superior -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none">
        <div class="ui-panel px-4 py-2 rounded-xl text-white shadow-lg pointer-events-auto">
            <h1 class="font-bold text-xs tracking-wider text-amber-400">LOGISTICS SIMULATOR</h1>
            <p id="mode-status" class="text-xs text-slate-300">Modo: A Pé (Trabalhador)</p>
        </div>
        <div class="ui-panel px-4 py-2 rounded-xl text-white shadow-lg text-right pointer-events-auto">
            <span class="text-xs text-amber-400 font-semibold">ESTATUTO</span>
            <p id="mission-text" class="text-xs text-slate-200">Aproxime-se do empilhador ou palete</p>
        </div>
    </div>

    <!-- Controlo Táctil / Joystick -->
    <div class="absolute bottom-6 left-6 flex items-center gap-4 pointer-events-auto">
        <div id="joystick-base" class="w-32 h-32 rounded-full bg-slate-900/60 border-2 border-slate-700 relative flex items-center justify-center shadow-inner">
            <div id="joystick-knob" class="w-12 h-12 rounded-full bg-amber-500 shadow-md absolute cursor-pointer transition-transform duration-75"></div>
        </div>
    </div>

    <!-- Botões de Ação Dinâmicos -->
    <div class="absolute bottom-6 right-6 flex flex-col gap-3 pointer-events-auto">
        <button id="toggle-mode-btn" class="ui-panel px-5 py-3 rounded-xl text-amber-400 font-bold shadow-lg border border-amber-500/30 flex items-center justify-center gap-2 active:scale-95 transition text-sm">
            <i class="fa-solid fa-person"></i> ENTRAR NO EMPILHADOR
        </button>
        <div id="forklift-controls" class="hidden flex flex-col gap-2">
            <button id="action-pallet-btn" class="ui-panel px-5 py-3 rounded-xl text-emerald-400 font-bold shadow-lg border border-emerald-500/30 flex items-center justify-center gap-2 active:scale-95 transition text-sm">
                <i class="fa-solid fa-box"></i> AGARRAR PALETE
            </button>
            <div class="flex gap-2">
                <button id="lift-up" class="ui-panel px-4 py-2.5 rounded-xl text-white font-bold flex-1 flex items-center justify-center gap-1 active:scale-95 transition text-xs">
                    <i class="fa-solid fa-arrow-up"></i> SUBIR
                </button>
                <button id="lift-down" class="ui-panel px-4 py-2.5 rounded-xl text-white font-bold flex-1 flex items-center justify-center gap-1 active:scale-95 transition text-xs">
                    <i class="fa-solid fa-arrow-down"></i> DESCER
                </button>
            </div>
        </div>
    </div>

    <!-- Dependências Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const baseUrl = 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/';

        let scene, camera, renderer, controls, clock;
        let warehouse, worker, forklift;
        let workerMixer, workerActions = {}, activeWorkerAction;
        let pallets = [], racks = [];
        let attachedPallet = null;
        let forksGroup, forksHeight = 0;

        let currentMode = 'worker'; // 'worker' or 'forklift'
        let moveForward = 0, moveTurn = 0;
        let speed = 0, maxSpeedWorker = 0.04, maxSpeedForklift = 0.08, turnSpeed = 0.04;

        init();
        animate();

        function init() {
            const container = id => document.getElementById(id);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);
            scene.fog = new THREE.FogExp2(0x0b0f19, 0.012);

            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, -6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.25;
            container('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            // Iluminação profissional
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
            dirLight.position.set(15, 25, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            const loader = new THREE.GLTFLoader();

            // 1. Armazém Principal (Com renderização em dupla face)
            loader.load(baseUrl + 'warehouse.glb', (gltf) => {
                warehouse = gltf.scene;
