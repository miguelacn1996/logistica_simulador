<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulador Logístico 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Overlay */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        /* Virtual Joystick */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            pointer-events: none;
        }
        /* Action Button */
        #action-btn {
            position: absolute;
            bottom: 50px;
            right: 40px;
            background: #ff9800;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            display: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>

    <!-- Three.js e Addons via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="loading">A carregar modelos 3D do GitHub...<br><span id="progress">0%</span></div>
    <div id="ui">
        <strong>Modo:</strong> <span id="mode-text">A Pé</span><br>
        <small>Usa o joystick para mover | Arrasta o ecrã para rodar a câmara</small>
    </div>

    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>
    <button id="action-btn">ENTRAR NO EMPILHADOR</button>

    <div id="canvas-container"></div>

    <script>
        // URLs do GitHub
        const urls = {
            warehouse: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/warehouse.glb',
            rack: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/rackpallet.glb',
            pallet: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/palleteuro.glb',
            forklift: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/forklift.glb',
            worker: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/worker.glb'
        };

        let scene, camera, renderer, controls;
        let worker, forklift, warehouse;
        let moveVector = new THREE.Vector3(0, 0, 0);
        let inVehicle = false;

        const loader = new THREE.GLTFLoader();

        init();

        function init() {
            // Cena e Câmara
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Controlos de Câmara (OrbitControls para rodar 360º livremente)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Não deixar passar abaixo do chão

            // Luzes fortes para evitar ecrã preto
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const dirLight2 = new THREE.DirectionalLight(0x90b0ff, 0.8);
            dirLight2.position.set(-10, 20, -10);
            scene.add(dirLight2);

            // Carregar Modelos do GitHub
            loadAssets();

            // Configurar Joystick Tátil
            setupJoystick();

            // Eventos
            window.addEventListener('resize', onWindowResize);
            document.getElementById('action-btn').addEventListener('click', toggleVehicle);

            animate();
        }

        function loadAssets() {
            let loadedCount = 0;
            const totalAssets = 5;

            function checkLoaded() {
                loadedCount++;
                const percent = Math.round((loadedCount / totalAssets) * 100);
                document.getElementById('progress').innerText = percent + '%';
                if (loadedCount >= totalAssets) {
                    document.getElementById('loading').style.display = 'none';
                }
            }

            // 1. Armazém
            loader.load(urls.warehouse, (gltf) => {
                warehouse = gltf.scene;
                // Centrar e ajustar escala automática do armazém
                const box = new THREE.Box3().setFromObject(warehouse);
                const center = box.getCenter(new THREE.Vector3());
                warehouse.position.sub(center); // Centrar na origem
                scene.add(warehouse);
                checkLoaded();
            }, undefined, (e) => console.error("Erro armazém:", e));

            // 2. Trabalhador
            loader.load(urls.worker, (gltf) => {
                worker = gltf.scene;
                worker.scale.set(1, 1, 1);
                worker.position.set(0, 0, 2);
                scene.add(worker);
                checkLoaded();
            }, undefined, (e) => {
                // Fallback caso falhe o trabalhador
                worker = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.4), new THREE.MeshStandardMaterial({color: 0x00ff00}));
                worker.position.set(0, 0.8, 2);
                scene.add(worker);
                checkLoaded();
            });

            // 3. Empilhador
            loader.load(urls.forklift, (gltf) => {
                forklift = gltf.scene;
                forklift.scale.set(1, 1, 1);
                forklift.position.set(4, 0, 0);
                scene.add(forklift);
                checkLoaded();
            }, undefined, (e) => {
                forklift = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 2.5), new THREE.MeshStandardMaterial({color: 0xffcc00}));
                forklift.position.set(4, 0.75, 0);
                scene.add(forklift);
                checkLoaded();
            });

            // 4. Estantes (Rack)
            loader.load(urls.rack, (gltf) => {
                const rack = gltf.scene;
                rack.position.set(-6, 0, -5);
                scene.add(rack);
                
                // Duplicar outra estante ao lado
                const rack2 = rack.clone();
                rack2.position.set(-6, 0, 5);
                scene.add(rack2);
                checkLoaded();
            }, undefined, () => checkLoaded());

            // 5. Palete
            loader.load(urls.pallet, (gltf) => {
                const pallet = gltf.scene;
                pallet.position.set(2, 0, 2);
                scene.add(pallet);
                checkLoaded();
            }, undefined, () => checkLoaded());
        }

        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const stick = document.getElementById('joystick-stick');
            let tracking = false;
            let center = { x: 0, y: 0 };
            const maxDist = 40;

            base.addEventListener('pointerdown', (e) => {
                tracking = true;
                const rect = base.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            });

            window.addEventListener('pointermove', (e) => {
                if (!tracking) return;
                const dx = e.clientX - center.x;
                const dy = e.clientY - center.y;
                const dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxDist);
                const angle = Math.atan2(dy, dx);

                const constrainedX = Math.cos(angle) * dist;
                const constrainedY = Math.sin(angle) * dist;

                stick.style.transform = `translate(${constrainedX}px, ${constrainedY}px)`;

                // Normalizar movimento para o vetor [-1, 1]
                moveVector.x = constrainedX / maxDist;
                moveVector.z = constrainedY / maxDist;
            });

            window.addEventListener('pointerup', () => {
                if (!tracking) return;
                tracking = false;
                stick.style.transform = `translate(0px, 0px)`;
                moveVector.set(0, 0, 0);
            });
        }

        function toggleVehicle() {
            inVehicle = !inVehicle;
            document.getElementById('mode-text').innerText = inVehicle ? 'A Conduzir Empilhador' : 'A Pé';
            document.getElementById('action-btn').innerText = inVehicle ? 'SAIR DO EMPILHADOR' : 'ENTRAR NO EMPILHADOR';
        }

        function updateGame() {
            const speed = 0.08;
            if (moveVector.lengthSq() > 0) {
                if (!inVehicle && worker) {
                    worker.position.x += moveVector.x * speed;
                    worker.position.z += moveVector.z * speed;
                    // Seguir câmara com a personagem
                    controls.target.copy(worker.position);
                    camera.position.x += moveVector.x * speed;
                    camera.position.z += moveVector.z * speed;
                } else if (inVehicle && forklift) {
                    forklift.position.x += moveVector.x * speed;
                    forklift.position.z += moveVector.z * speed;
                    controls.target.copy(forklift.position);
                    camera.position.x += moveVector.x * speed;
                    camera.position.z += moveVector.z * speed;
                }
            }

            // Verificar proximidade ao empilhador para mostrar o botão
            if (!inVehicle && worker && forklift) {
                const dist = worker.position.distanceTo(forklift.position);
                const btn = document.getElementById('action-btn');
                if (dist < 3.0) {
                    btn.style.display = 'block';
                } else {
                    btn.style.display = 'none';
                }
            } else if (inVehicle) {
                document.getElementById('action-btn').style.display = 'block';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
