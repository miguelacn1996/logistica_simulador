<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulador Logístico 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            pointer-events: none;
        }
        #action-btn {
            position: absolute;
            bottom: 50px;
            right: 40px;
            background: #ff9800;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            display: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="loading">A carregar modelos 3D do GitHub...<br><span id="progress">0%</span></div>
    <div id="ui">
        <strong>Modo:</strong> <span id="mode-text">A Pé</span><br>
        <small>Usa o joystick para mover | Arrasta o ecrã para rodar</small>
    </div>

    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>
    <button id="action-btn">ENTRAR NO EMPILHADOR</button>

    <div id="canvas-container"></div>

    <script>
        const urls = {
            warehouse: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/warehouse.glb',
            rack: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/rackpallet.glb',
            pallet: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/palleteuro.glb',
            forklift: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/forklift.glb',
            worker: 'https://raw.githubusercontent.com/miguelacn1996/logistica_simulador/main/worker.glb'
        };

        let scene, camera, renderer, controls;
        let worker, forklift, warehouse;
        let moveVector = new THREE.Vector3(0, 0, 0);
        let inVehicle = false;

        const loader = new THREE.GLTFLoader();

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            scene.add(new THREE.AmbientLight(0xffffff, 1.4));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            loadAssets();
            setupJoystick();

            window.addEventListener('resize', onWindowResize);
            document.getElementById('action-btn').addEventListener('click', toggleVehicle);

            animate();
        }

        function loadAssets() {
            let loadedCount = 0;
            const totalAssets = 5;

            function checkLoaded() {
                loadedCount++;
                const percent = Math.round((loadedCount / totalAssets) * 100);
                document.getElementById('progress').innerText = percent + '%';
                if (loadedCount >= totalAssets) {
                    document.getElementById('loading').style.display = 'none';
                }
            }

            loader.load(urls.warehouse, (gltf) => {
                warehouse = gltf.scene;
                warehouse.scale.set(8, 8, 8);
                warehouse.position.set(0, 0, 0);
                scene.add(warehouse);
                checkLoaded();
            }, undefined, () => checkLoaded());

            loader.load(urls.worker, (gltf) => {
                worker = gltf.scene;
                worker.scale.set(1.2, 1.2, 1.2);
                worker.position.set(0, 0, 3);
                scene.add(worker);
                checkLoaded();
            }, undefined, () => {
                worker = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.4), new THREE.MeshStandardMaterial({color: 0x00ff00}));
                worker.position.set(0, 0.8, 3);
                scene.add(worker);
                checkLoaded();
            });

            loader.load(urls.forklift, (gltf) => {
                forklift = gltf.scene;
                forklift.scale.set(1.2, 1.2, 1.2);
                forklift.position.set(5, 0, 0);
                scene.add(forklift);
                checkLoaded();
            }, undefined, () => {
                forklift = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 2.5), new THREE.MeshStandardMaterial({color: 0xffcc00}));
                forklift.position.set(5, 0.75, 0);
                scene.add(forklift);
                checkLoaded();
            });

            loader.load(urls.rack, (gltf) => {
                const rack = gltf.scene;
                rack.scale.set(1.5, 1.5, 1.5);
                rack.position.set(-8, 0, -6);
                scene.add(rack);
                
                const rack2 = rack.clone();
                rack2.position.set(-8, 0, 6);
                scene.add(rack2);
                checkLoaded();
            }, undefined, () => checkLoaded());

            loader.load(urls.pallet, (gltf) => {
                const pallet = gltf.scene;
                pallet.scale.set(1.5, 1.5, 1.5);
                pallet.position.set(2, 0, 3);
                scene.add(pallet);
                checkLoaded();
            }, undefined, () => checkLoaded());
        }

        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const stick = document.getElementById('joystick-stick');
            let tracking = false;
            let center = { x: 0, y: 0 };
            const maxDist = 40;

            base.addEventListener('pointerdown', (e) => {
                tracking = true;
                const rect = base.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            });

            window.addEventListener('pointermove', (e) => {
                if (!tracking) return;
                const dx = e.clientX - center.x;
                const dy = e.clientY - center.y;
                const dist = Math.min(Math.sqrt(dx * dx + dy * dy), maxDist);
                const angle = Math.atan2(dy, dx);

                const constrainedX = Math.cos(angle) * dist;
                const constrainedY = Math.sin(angle) * dist;

                stick.style.transform = `translate(${constrainedX}px, ${constrainedY}px)`;
                moveVector.x = constrainedX / maxDist;
                moveVector.z = constrainedY / maxDist;
            });

            window.addEventListener('pointerup', () => {
                if (!tracking) return;
                tracking = false;
                stick.style.transform = `translate(0px, 0px)`;
                moveVector.set(0, 0, 0);
            });
